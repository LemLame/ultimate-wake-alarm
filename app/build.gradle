plugins { id 'com.android.application' }

android {
    namespace 'jp.waketerminal'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.waketerminal'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.1'
        testInstrumentationRunner 'jp.waketerminal.DeviceTests'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
